name: Nix Build

on:
  workflow_dispatch:
  # PRs build the flake only when they touch what the flake consumes;
  # every merge to main still builds it against the full tree, so a
  # regression from ordinary Rust changes is caught one merge later
  # instead of charging every PR push ~10-30 min.
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgRio.nix'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'misc/**'
      - '.github/workflows/nix-build.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgRio.nix'
      - 'misc/**'
      - '.github/workflows/nix-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lints:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        # Both Linux arches so the cachix cache serves x86_64 users too,
        # not just the arm runner's own architecture.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      # Read existing cache entries without publishing from this fork.
      - uses: cachix/cachix-action@v17
        with:
          name: rioterm
          skipPush: true
      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix build --max-jobs auto --build-max-jobs auto --print-build-logs
